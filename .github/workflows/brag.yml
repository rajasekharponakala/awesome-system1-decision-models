name: Brag video

# Makes a short launch video of this repo's Snake race showcase with the
# /brag agent skill (https://github.com/latent-spaces/brag), run by Claude Code
# through anthropics/claude-code-action. The video, poster, plan and share copy
# are uploaded as the `brag-video` artifact. Nothing is committed or pushed.
#
# Needs one repository secret: ANTHROPIC_API_KEY (or CLAUDE_CODE_OAUTH_TOKEN
# from `claude setup-token`). Use a dedicated key with a spend limit: this job
# runs third-party code (the brag skill and the Hyperframes CLI), both pinned
# below, in the same job as that key. No other secrets are exposed here.
#
# Manual trigger only, because each run spends model tokens.

on:
  workflow_dispatch:
    inputs:
      tone:
        description: "Tone preset (default, polished, yc-parody, chaotic, deadpan, cinematic, app-store) or a freeform direction"
        default: "default"
      format:
        description: Video format
        type: choice
        options: [landscape, vertical, square]
        default: landscape
      direction:
        description: Extra creative direction (optional)
        default: ""

permissions:
  contents: read

concurrency:
  group: brag-video
  cancel-in-progress: false

env:
  BRAG_REPO: https://github.com/latent-spaces/brag
  BRAG_SHA: 57ce4c9bb912f01a0078b154318bf67c5cbf780f # brag 0.3.0
  HYPERFRAMES_VERSION: 0.8.61

jobs:
  brag:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          ffmpeg -version | head -1

      - name: Install Hyperframes and its companion skills
        run: |
          npm install -g "hyperframes@$HYPERFRAMES_VERSION"
          npx hyperframes skills
          # Claude Code reads user skills from ~/.claude/skills; link any
          # companion skills that were installed for other agents.
          mkdir -p ~/.claude/skills
          for d in ~/.agents/skills/*; do
            [ -d "$d" ] && [ ! -e ~/.claude/skills/"$(basename "$d")" ] && ln -s "$d" ~/.claude/skills/ || true
          done
          ls ~/.claude/skills
          npx hyperframes doctor || true

      - name: Install the brag skill (pinned)
        run: |
          git init -q "$RUNNER_TEMP/brag"
          git -C "$RUNNER_TEMP/brag" fetch -q --depth 1 "$BRAG_REPO" "$BRAG_SHA"
          git -C "$RUNNER_TEMP/brag" checkout -q FETCH_HEAD
          mkdir -p .claude/skills
          cp -r "$RUNNER_TEMP/brag/skills/brag" .claude/skills/brag

      - name: Make the video with /brag
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 200
            --allowedTools Skill,Read,Write,Edit,Glob,Grep,Bash
          prompt: |
            Use the brag skill to make a launch video for this repository.
            Invocation: /brag --tone "${{ inputs.tone }}" --format ${{ inputs.format }}
            ${{ inputs.direction }}

            The product to brag about is the System 1 Snake Race in showcase/snake-race/:
            two System 1 decision models (TypeSafe Jev and Convai Laya) play the same
            game of Snake side by side, and a slow model's snake crashes as the tick
            rate rises. Context lives in README.md, SHOWCASE_IDEAS.md and
            showcase/snake-race/README.md. The UI is showcase/snake-race/public/.

            Ground rules:
            - Any benchmark number shown must come from showcase/snake-race/RESULTS.md,
              copied exactly, with its setup caveats (runner, CPU vs API, network).
              If that file does not exist, show no numbers at all.
            - Never present the mock lanes (Mock A / Mock B) as model results.
            - Do not claim one model is better overall; show what was measured.
            - This is a CI run with no human: make every choice yourself, never wait
              for input, and do not open a preview server that blocks.
            - Write everything to brag-output/. Do not commit, push, or edit files
              outside brag-output/.

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: brag-video
          path: |
            brag-output*/brag.mp4
            brag-output*/brag.jpg
            brag-output*/share-copy.txt
            brag-output*/brag-plan.md
            brag-output*/*brief*.md
          if-no-files-found: warn
