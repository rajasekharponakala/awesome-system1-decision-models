name: Render launch video

# Renders showcase/snake-race/video (a Hyperframes composition) to MP4.
# No secrets and no AI agent: the composition is committed, and this job only
# renders it. The storyboard follows the /brag skill's rules
# (https://github.com/latent-spaces/brag), and the sound effects are Kenney
# CC0 files taken from brag's pinned commit.

on:
  workflow_dispatch:
  push:
    paths:
      - showcase/snake-race/video/**
      - .github/workflows/render-video.yml

permissions:
  contents: read

concurrency:
  group: render-video-${{ github.ref }}
  cancel-in-progress: true

env:
  HYPERFRAMES_VERSION: 0.8.61
  BRAG_REPO: https://github.com/latent-spaces/brag
  BRAG_SHA: 57ce4c9bb912f01a0078b154318bf67c5cbf780f # brag 0.3.0, source of the CC0 Kenney SFX

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: showcase/snake-race/video
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg and fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-inter fonts-jetbrains-mono || sudo apt-get install -y -q ffmpeg
          ffmpeg -version | head -1

      - name: Install Hyperframes
        run: |
          npm install -g "hyperframes@$HYPERFRAMES_VERSION"
          npx hyperframes doctor || true

      - name: Fetch sound effects (Kenney, CC0)
        run: |
          git init -q "$RUNNER_TEMP/brag"
          git -C "$RUNNER_TEMP/brag" fetch -q --depth 1 "$BRAG_REPO" "$BRAG_SHA"
          git -C "$RUNNER_TEMP/brag" checkout -q FETCH_HEAD
          mkdir -p assets/sfx
          src="$RUNNER_TEMP/brag/skills/brag/assets/sfx"
          cp "$src"/impact/impactSoft_medium_00{1,2,3,4}.ogg "$src"/interface/bong_001.ogg assets/sfx/
          ls -l assets/sfx

      - name: Lint and check
        run: |
          npx hyperframes lint .
          npx hyperframes check

      - name: Render
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          npx hyperframes render --quality high -o "$RUNNER_TEMP/out/snake-race.mp4"
          ffprobe -v error -show_entries format=duration:stream=width,height -of default=nw=1 "$RUNNER_TEMP/out/snake-race.mp4"

      - name: Poster frame and README preview GIF
        run: |
          out="$RUNNER_TEMP/out"
          ffmpeg -y -loglevel error -ss 6.5 -i "$out/snake-race.mp4" -frames:v 1 -q:v 2 "$out/snake-race.jpg"
          # GitHub READMEs play GIFs inline but not committed MP4s, so ship a small GIF preview.
          ffmpeg -y -loglevel error -i "$out/snake-race.mp4" -filter_complex \
            "fps=10,scale=800:-1:flags=lanczos,split[a][b];[a]palettegen=max_colors=96:stats_mode=diff[p];[b][p]paletteuse=dither=bayer:bayer_scale=4" \
            -loop 0 "$out/snake-race.gif"
          ls -lh "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: snake-race-video
          path: ${{ runner.temp }}/out

  # Commits the rendered files to docs/media so the README can show them.
  # This is the only job with write access, and it runs no third-party code:
  # it just downloads the render job's artifact and commits it. Pushes made
  # with GITHUB_TOKEN don't trigger other workflows, so this can't loop.
  publish:
    needs: render
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: snake-race-video
          path: docs/media

      - name: Commit updated media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/snake-race.mp4 docs/media/snake-race.gif docs/media/snake-race.jpg
          if git diff --cached --quiet; then
            echo "Media unchanged."
            exit 0
          fi
          git commit -m "Update launch video media (render run ${{ github.run_id }})"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
