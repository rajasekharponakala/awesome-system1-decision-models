name: Snake race benchmark

# Benchmarks Jev and Laya with showcase/snake-race/bench.mjs on GitHub-hosted
# runners, which can reach both the TypeSafe API and Hugging Face.
#
# Security design: the two lanes run in separate jobs.
#   - `jev` receives the TYPESAFE_API_KEY secret and runs only this repo's code
#     (bench.mjs has no dependencies beyond Node itself).
#   - `laya` builds and runs third-party code (LiteVar/system-one and its
#     crates) and receives no secrets.
# So third-party code never runs in a job that can read the Jev key.

on:
  workflow_dispatch:
    inputs:
      positions:
        description: Positions per lane
        default: "200"
      warmup:
        description: Warm-up calls discarded per lane
        default: "10"
      seed:
        description: Seed for the position set
        default: "7"
      system_one_ref:
        description: LiteVar/system-one commit, tag or branch to build for Laya
        default: main
  push:
    paths:
      - showcase/snake-race/**
      - "!showcase/snake-race/video/**"
      - "!showcase/snake-race/RESULTS.md"
      - "!showcase/snake-race/**/*.md"
      - .github/workflows/snake-race-bench.yml

permissions:
  contents: read

concurrency:
  group: snake-race-bench-${{ github.ref }}
  cancel-in-progress: true

env:
  POSITIONS: ${{ inputs.positions || '100' }}
  WARMUP: ${{ inputs.warmup || '10' }}
  SEED: ${{ inputs.seed || '7' }}

jobs:
  jev:
    name: Jev (TypeSafe API)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run benchmark
        working-directory: showcase/snake-race
        env:
          # Secrets only. Never read the key from `vars`: Actions variables are
          # not masked, so GitHub prints them in the step's env block.
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          BENCH_RUNNER: GitHub ubuntu-latest, API over the internet
        run: |
          if [ -z "$TYPESAFE_API_KEY" ]; then
            echo "::error::No TYPESAFE_API_KEY secret. Add it under Settings > Secrets and variables > Actions > Secrets (not Variables)."
            exit 1
          fi
          node bench.mjs --no-mock --n "$POSITIONS" --warmup "$WARMUP" --seed "$SEED" --out "$RUNNER_TEMP/jev"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-jev
          path: ${{ runner.temp }}/jev
          if-no-files-found: ignore

  laya:
    name: Laya (System One Runtime, CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch System One Runtime
        env:
          REF: ${{ inputs.system_one_ref || 'main' }}
        run: |
          git clone https://github.com/LiteVar/system-one "$RUNNER_TEMP/system-one"
          git -C "$RUNNER_TEMP/system-one" checkout --detach "$REF"
          echo "SYSTEM_ONE_SHA=$(git -C "$RUNNER_TEMP/system-one" rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Cache Rust build and model assets
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ runner.temp }}/system-one/target
            ~/.cache
            ~/.local/share
          key: system-one-${{ runner.os }}-${{ env.SYSTEM_ONE_SHA }}
          restore-keys: system-one-${{ runner.os }}-

      - name: Build
        working-directory: ${{ runner.temp }}/system-one
        run: cargo build --release --locked

      - name: Pull model
        timeout-minutes: 20
        working-directory: ${{ runner.temp }}/system-one
        run: |
          # Print download progress every 30 s so a slow or stuck pull is visible.
          ( while sleep 30; do
              echo "[progress] $(date -u +%H:%M:%S) $(du -sh ~/.cache ~/.local/share . 2>/dev/null | tr '\n' ' ')"
            done ) &
          watcher=$!
          cargo run --release --locked -- model pull laya-multilingual 2>&1 | tee "$RUNNER_TEMP/pull.log"
          status=${PIPESTATUS[0]}
          kill $watcher 2>/dev/null || true
          exit $status

      - name: Start server
        timeout-minutes: 10
        working-directory: ${{ runner.temp }}/system-one
        run: |
          nohup cargo run --release --locked -- serve > "$RUNNER_TEMP/laya.log" 2>&1 &
          body='{"model":"laya-multilingual","state":"I was charged twice.","questions":{"q":{"type":"choice","instructions":"Topic?","criteria":{"billing":null,"technical":null}}}}'
          for i in $(seq 1 100); do
            if curl -sf http://127.0.0.1:8080/v1/systemone -H 'content-type: application/json' -d "$body" -o "$RUNNER_TEMP/probe.json"; then
              echo "Ready after about $((i * 5)) s:"; cat "$RUNNER_TEMP/probe.json"; echo
              exit 0
            fi
            if [ $((i % 6)) -eq 0 ]; then echo "[waiting] $((i * 5)) s"; tail -3 "$RUNNER_TEMP/laya.log"; fi
            sleep 5
          done
          echo "::error::Laya server did not answer within about 8 minutes"
          tail -80 "$RUNNER_TEMP/laya.log"
          exit 1

      - name: Run benchmark
        working-directory: showcase/snake-race
        env:
          LAYA_BASE_URL: http://127.0.0.1:8080
          BENCH_RUNNER: GitHub ubuntu-latest, local CPU
        run: node bench.mjs --no-mock --n "$POSITIONS" --warmup "$WARMUP" --seed "$SEED" --out "$RUNNER_TEMP/laya"

      - name: Server log
        if: always()
        run: |
          echo "--- model pull (last 40 lines)"; tail -40 "$RUNNER_TEMP/pull.log" 2>/dev/null || true
          echo "--- server (last 80 lines)"; tail -80 "$RUNNER_TEMP/laya.log" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-laya
          path: |
            ${{ runner.temp }}/laya
            ${{ runner.temp }}/laya.log
            ${{ runner.temp }}/pull.log
          if-no-files-found: ignore

  report:
    name: Report
    needs: [jev, laya]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: results

      - name: Write summary
        env:
          JEV_RESULT: ${{ needs.jev.result }}
          LAYA_RESULT: ${{ needs.laya.result }}
        run: |
          {
            echo "## Snake race benchmark: Jev vs Laya"
            echo
            node showcase/snake-race/report.mjs results/results-jev results/results-laya/laya results/results-laya
            echo
            echo "Jobs: Jev \`$JEV_RESULT\`, Laya \`$LAYA_RESULT\`."
            echo
            echo "**Read with care.** Each lane ran on its own GitHub-hosted runner (\`ubuntu-latest\`, CPU only)."
            echo "Jev's latency includes the internet round trip from the runner to the TypeSafe API."
            echo "Laya ran locally on the runner's CPU, so it would be faster on a GPU."
            echo "safe move % counts moves that did not hit a wall or the snake's body; closer to food % is measured only on positions where a safe closer move existed."
          } | tee -a "$GITHUB_STEP_SUMMARY"
